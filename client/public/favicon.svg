<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#ffffff" rx="20"/>

  <!-- Golf ball -->
  <circle cx="50" cy="50" r="30" fill="#ffffff" stroke="#2d5016" stroke-width="2"/>

  <!-- Dimples on golf ball -->
  <circle cx="35" cy="35" r="2" fill="#2d5016"/>
  <circle cx="45" cy="35" r="2" fill="#2d5016"/>
  <circle cx="55" cy="35" r="2" fill="#2d5016"/>
  <circle cx="65" cy="35" r="2" fill="#2d5016"/>

  <circle cx="40" cy="50" r="2" fill="#2d5016"/>
  <circle cx="50" cy="50" r="2" fill="#2d5016"/>
  <circle cx="60" cy="50" r="2" fill="#2d5016"/>

  <circle cx="35" cy="65" r="2" fill="#2d5016"/>
  <circle cx="45" cy="65" r="2" fill="#2d5016"/>
  <circle cx="55" cy="65" r="2" fill="#2d5016"/>
  <circle cx="65" cy="65" r="2" fill="#2d5016"/>

  <!-- Golf tee -->
  <rect x="48" y="75" width="4" height="15" fill="#8b7355" rx="2"/>
  <circle cx="50" cy="75" r="3" fill="#228B22"/>
</svg>
